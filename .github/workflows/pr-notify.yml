# Posts a Microsoft Teams card when a PR targets a watched branch. Self-contained: no other repo needed.
# Secrets: TEAMS_WEBHOOK_<TEAMS_CHAT>. Variable: TEAMS_USER_MAP
#   {"<github-login>":{"name":"<Teams name>","email":"<Teams email>"}}
name: PR notify

on:
  pull_request:
    types: [opened, reopened, ready_for_review, closed]
    branches: [develop]   # edit: branches whose PRs notify Teams

env:
  # ---- edit per project ----
  PROJECT: project-1
  TEAMS_CHAT: URL   # FRONTEND or BACKEND in company orgs; this test org's secret is TEAMS_WEBHOOK_URL
  DEFAULT_MENTIONS: '["Thamarai-selvan-G-Noukha"]'   # GitHub logins always tagged

jobs:
  notify:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Send Teams card
        env:
          WEBHOOK: ${{ secrets[format('TEAMS_WEBHOOK_{0}', env.TEAMS_CHAT)] }}
          # Passed via env, never inlined in the script: PR titles are untrusted input.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUM: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_ACTION: ${{ github.event.action }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          REPO: ${{ github.repository }}
          REVIEWERS: ${{ toJSON(github.event.pull_request.requested_reviewers.*.login) }}
          USER_MAP: ${{ vars.TEAMS_USER_MAP || '{}' }}
        run: |
          # Open / Merged / Closed: must match the PR_Card_Map Status choices
          status=Open
          [ "$PR_ACTION" = closed ] && { [ "$PR_MERGED" = true ] && status=Merged || status=Closed; }
          payload=$(jq -n \
            --arg status "$status" --arg repo "$REPO" \
            --arg project "$PROJECT" --arg title "$PR_TITLE" --arg author "$PR_AUTHOR" --arg url "$PR_URL" --arg num "$PR_NUM" --arg head "$PR_HEAD" --arg base "$PR_BASE" \
            --argjson map "$USER_MAP" --argjson rev "$REVIEWERS" --argjson def "$DEFAULT_MENTIONS" '
            # author mentioned too when in the map; reviewers = requested + defaults, mapped only
            ($map[$author] // null) as $me |
            (if $me then "<at>\($me.name)</at>" else $author end) as $who |
            ([$rev[], $def[]] | unique | map(select(. != $author and $map[.] != null)) | map($map[.])) as $tags |
            def row($label; $value; $bold): {type:"ColumnSet", spacing:"Small", columns:[
              {type:"Column", width:"90px", items:[{type:"TextBlock", text:$label, isSubtle:true, wrap:true}]},
              {type:"Column", width:"stretch", items:[{type:"TextBlock", text:$value, wrap:true} + (if $bold then {weight:"Bolder"} else {} end)]}]};
            # header band style + status text colour: Open = orange, Merged = green, Closed = red
            ({Open:{s:"warning", h:"🔀 NEW PULL REQUEST", c:"Warning"},
              Merged:{s:"good", h:"✅ MERGED", c:"Good"},
              Closed:{s:"attention", h:"🔴 CLOSED", c:"Attention"}}[$status]) as $st |
            # flow payload: pr_key finds the existing Teams message so the same card is updated
            {pr_key:($repo + "#" + $num), repo:$repo, status:$status,
              card:{
                "$schema":"http://adaptivecards.io/schemas/adaptive-card.json",
                type:"AdaptiveCard", version:"1.4",
                body:([
                  # header band: colour comes from the container style only; text keeps the theme default (white/black)
                  {type:"Container", style:$st.s, bleed:true, items:[
                    {type:"TextBlock", text:($st.h + "  #" + $num), size:"Medium", weight:"Bolder", wrap:true}
                  ]},
                  {type:"TextBlock", text:("📁 " + $project), size:"Small", weight:"Bolder", isSubtle:true, wrap:true, spacing:"Medium"},
                  {type:"TextBlock", text:$title, size:"ExtraLarge", weight:"Bolder", wrap:true, spacing:"Small"},
                  (row("↪️ Branch"; ($head + " → " + $base); false) + {spacing:"Medium", separator:true}),
                  (row("📌 Status"; $status; true) | .columns[1].items[0].color = $st.c),
                  row("👤 Raised by"; $who; true)
                ]
                + (if ($tags|length) == 0 then [] else
                    [row("🔍 Reviewer"; ($tags | map("<at>\(.name)</at>") | join(", ")); false)] end)),
                actions:[{type:"Action.OpenUrl", title:"Open PR", url:$url, style:"positive"}],
                msteams:{width:"Full", entities:(([$me] | map(select(. != null))) + $tags | unique_by(.email)
                  | map({type:"mention", text:"<at>\(.name)</at>", mentioned:{id:.email, name:.name}}))}
              }}')
          curl -fsS --retry 3 -X POST -H 'Content-Type: application/json' -d "$payload" "$WEBHOOK"
